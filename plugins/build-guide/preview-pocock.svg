<text x="20" y="34" class="h ink">You are here</text><text x="440" y="34" class="sm mut" text-anchor="end">step 4 of 7</text><line class="ln" stroke-width="2" x1="34" x2="426" y1="76" y2="76"/><circle cx="34" cy="76" r="11" fill="#0071E3"/><path d="M29.5 76 l3 3.2 l6 -6.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="112" text-anchor="middle" font-size="11.5" class="mut">Grill</text><circle cx="99.33333333333333" cy="76" r="11" fill="#5E5CE6"/><path d="M94.83333333333333 76 l3 3.2 l6 -6.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="99.33333333333333" y="112" text-anchor="middle" font-size="11.5" class="mut">Spec</text><circle cx="164.66666666666666" cy="76" r="11" fill="#AF52DE"/><path d="M160.16666666666666 76 l3 3.2 l6 -6.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="164.66666666666666" y="112" text-anchor="middle" font-size="11.5" class="mut">Tickets</text><circle cx="230" cy="76" r="19" fill="#F56300" fill-opacity=".2"/><circle cx="230" cy="76" r="14" fill="#F56300"/><text x="230" y="80.5" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="700">4</text><text x="230" y="112" text-anchor="middle" font-size="11.5" fill="#B54700" font-weight="700">Build</text><circle cx="295.3333333333333" cy="76" r="10" fill="#E5E5EA"/><text x="295.3333333333333" y="80" text-anchor="middle" font-size="11" font-weight="600" class="mut">5</text><text x="295.3333333333333" y="112" text-anchor="middle" font-size="11.5" class="mut">Review</text><circle cx="360.66666666666663" cy="76" r="10" fill="#E5E5EA"/><text x="360.66666666666663" y="80" text-anchor="middle" font-size="11" font-weight="600" class="mut">6</text><text x="360.66666666666663" y="112" text-anchor="middle" font-size="11.5" class="mut">PR</text><circle cx="426" cy="76" r="10" fill="#E5E5EA"/><text x="426" y="80" text-anchor="middle" font-size="11" font-weight="600" class="mut">7</text><text x="426" y="112" text-anchor="middle" font-size="11.5" class="mut">Retro</text><rect class="card" x="16" y="132" width="428" height="170" rx="12"/><rect x="16" y="146" width="4" height="22" rx="2" fill="#F56300"/><text x="30" y="163" class="ink" font-size="17" font-weight="700">Build</text><g class="chip"><title>The skill for the Build step</title><rect x="337" y="145" width="95" height="24" rx="12" fill="#F56300" fill-opacity=".13"/><text x="384.5" y="161.5" text-anchor="middle" fill="#B54700" font-size="12.5" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">/implement</text></g><text x="30" y="190" font-size="11" font-weight="700" fill="#B54700" letter-spacing=".04em">WHAT IT IS</text><text x="30" y="207" class="body ink">Claude builds it test-first: a test that fails, then the</text><text x="30" y="223" class="body ink">code that makes it pass.</text><text x="30" y="249" font-size="11" font-weight="700" fill="#B54700" letter-spacing=".04em">WHAT YOU DO</text><text x="30" y="266" class="body ink">Watch the tests go red, then green. Clear the chat</text><text x="30" y="282" class="body ink">before each new ticket.</text><rect x="16" y="314" width="428" height="74" rx="10" fill="#0071E3" fill-opacity=".1" stroke="#0071E3" stroke-opacity=".45"/><text x="30" y="336" font-size="13" font-weight="700" fill="#0058B0">Keep the chat clean</text><text x="30" y="356" class="body ink">Clear the chat before each ticket. The ticket holds</text><text x="30" y="372" class="body ink">everything Claude needs.</text><rect x="16" y="400" width="428" height="116" rx="12" fill="#1DA851" fill-opacity=".13" stroke="#1DA851" stroke-opacity=".5"/><circle cx="48" cy="438" r="20" fill="#1DA851"/><path d="M38 438 h16 m-6 -7 l7 7 l-7 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="426" font-size="11.5" font-weight="700" fill="#137A3A" letter-spacing=".04em">NEXT STEP</text><text x="80" y="447" class="ink" font-size="17" font-weight="700">Review the change</text><text x="80" y="467" font-size="12.5" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" class="ink">/code-review since main</text><text x="80" y="486" class="sm mut">Two reviewers read the diff before anyone else</text><text x="80" y="502" class="sm mut">sees it.</text></svg></svg>